<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Free Account - Utkal Print Portal</title>
  
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      background: radial-gradient(circle at 50% 15%, rgba(255, 107, 0, 0.14) 0%, transparent 55%),
                  radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.1) 0%, transparent 55%),
                  #fbfbf9;
    }
    .auth-card {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 24px;
      box-shadow: 0 25px 55px -12px rgba(15, 23, 42, 0.12), 0 0 0 1px rgba(226, 232, 240, 0.6);
      max-width: 500px;
      width: 100%;
      overflow: hidden;
      position: relative;
      z-index: 2;
      backdrop-filter: blur(16px);
    }
    .auth-header {
      background: linear-gradient(135deg, #0b1120 0%, #1e293b 100%);
      padding: 34px 24px;
      text-align: center;
      color: #ffffff;
      position: relative;
    }
    .auth-header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #ff6b00, #10b981);
    }
    .auth-body {
      padding: 32px 28px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 0.88rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrapper i.icon-lead {
      position: absolute;
      left: 14px;
      color: #94a3b8;
      font-size: 1rem;
    }
    .form-control {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      font-size: 0.92rem;
      color: #1e293b;
      transition: all 0.25s ease;
      outline: none;
    }
    .form-control:focus {
      border-color: #ff6b00;
      box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.15);
    }
    @media (max-width: 500px) {
      .auth-container {
        padding: 20px 14px;
      }
      .auth-header {
        padding: 24px 18px;
      }
      .auth-body {
        padding: 22px 18px;
      }
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="brand-logo" style="justify-content: center; color: #fff; margin-bottom: 8px;">
          <div class="brand-logo-icon" style="width:38px; height:38px; font-size:1.1rem;">
            <i class="fa-solid fa-print"></i>
          </div>
          <span style="color:#ffffff;">UTKAL<span style="color:#ff8a00;">PRINT</span></span>
          <span class="brand-badge">PRO</span>
        </a>
        <p style="font-size: 0.88rem; color: #cbd5e1; margin: 0;">Register for instant print & PAN verification services</p>
      </div>

      <div class="auth-body">
        <form id="registerForm">
          <!-- Full Name -->
          <div class="form-group">
            <label class="form-label" for="regName">Full Name</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-user icon-lead"></i>
              <input type="text" id="regName" class="form-control" placeholder="e.g. Ramesh Kumar Patra" required autofocus>
            </div>
          </div>

          <!-- Email Address -->
          <div class="form-group">
            <label class="form-label" for="regEmail">Email Address</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-envelope icon-lead"></i>
              <input type="email" id="regEmail" class="form-control" placeholder="ramesh@example.com" required>
            </div>
          </div>

          <!-- Phone Number -->
          <div class="form-group">
            <label class="form-label" for="regPhone">Mobile Number (WhatsApp Enabled)</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-phone icon-lead"></i>
              <input type="tel" id="regPhone" class="form-control" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
            </div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label class="form-label" for="regPassword">Password (Min 6 characters)</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock icon-lead"></i>
              <input type="password" id="regPassword" class="form-control" placeholder="Create a secure password" minlength="6" required>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <label class="form-label" for="regPasswordConfirm">Confirm Password</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-shield-halved icon-lead"></i>
              <input type="password" id="regPasswordConfirm" class="form-control" placeholder="Re-enter your password" minlength="6" required>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="btnSubmit" class="btn-tiranga" style="width: 100%; justify-content: center; padding: 13px; font-size: 1rem; border-radius: 12px; margin-top: 10px;">
            <i class="fa-solid fa-user-check"></i> Register Free Account
          </button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: #64748b;">
          Already have an account? 
          <a href="login.html" style="color: #ff6b00; font-weight: 700; text-decoration: none;">Login here</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById('registerForm');
    const btnSubmit = document.getElementById('btnSubmit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const password = document.getElementById('regPassword').value;
      const password_confirmation = document.getElementById('regPasswordConfirm').value;

      if (password !== password_confirmation) {
        showToast('Passwords do not match!', 'error');
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating Account...';

      try {
        const res = await API.register({ name, email, phone, password, password_confirmation });
        window.location.href = getAppPath('user/dashboard.html');
      } catch (err) {
        showToast(err.message || 'Registration failed. Please check your inputs.', 'error');
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<i class="fa-solid fa-user-check"></i> Register Free Account';
      }
    });
  </script>
</body>
</html>
